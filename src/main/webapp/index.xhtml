<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="pt-br" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Página JSF</title>
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/css/style.css" />
</head>

<h:body>
    <h:form id="formpratica">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
        <table>
            <th>
                Formulário de práticas
            </th>
            <tr>
                <td>
                    <h:inputTextarea value="#{beanPage.title}" />
                </td>
            </tr>
            <tr>
                <td>
                    <h:selectOneMenu>
                        <f:selectItems value="#{['um','dois','tres']}" />
                    </h:selectOneMenu>
                </td>
            </tr>
            <tr>
                <td>
                    <h:selectOneListbox>
                        <f:selectItems value="#{[1,2,3,'um','dois','tres']}" />
                    </h:selectOneListbox>
                </td>
            </tr>
            <tr>
                <td>
                    <h:inputTextarea label="Conteúdo" id="conteudo" required="true" value="#{beanPage.content}" />
                </td>
            </tr>
            <tr>
                <td>
                    <h:message for="conteudo" style="color: red;"></h:message>
                </td>
            </tr>
            <tr>
                <td>
                    <h:commandButton value="Enviar"></h:commandButton>
                </td>
            </tr>
        </table>
    </h:form>
</h:body>

</html>
