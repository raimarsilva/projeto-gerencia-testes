<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/base :: layout(~{::#cadastro}, ~{::title})}">

<head>
  <meta charset="UTF-8">
  <title>Novo contrato</title>
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new TomSelect("#unidade", {
        create: false,
        sortField: {
          field: "text",
          direction: "asc"
        }
      });
    });
  </script>
</head>

<body>
  <div id="cadastro" class="max-w-5xl mx-auto my-6 p-6 bg-white rounded-sm shadow-sm border border-slate-200">
    <div th:replace="~{fragments/btn-back}"></div>
    <div class="title">
      <h1>CADASTRAR CONTRATO</h1>
    </div>
    <form th:action="@{/cadastrar}" th:object="${contrato}" method="post" class="grid grid-cols-1 md:grid-cols-3 gap-4"
      onsubmit="this.querySelector('button[type=submit]').disabled = true;">

      <!-- ================= DADOS DO CONTRATO ================= -->
      <div class="col-span-full text-center">Dados do Contrato</div>

      <div class="flex flex-col">
        <label for="anoContrato">Ano do contrato</label>
        <input type="number" id="anoContrato" name="anoContrato" th:value="${#dates.year(#dates.createNow())}" readonly
          class="border-none" />
      </div>

      <div class="flex flex-col">
        <label for="numProc">Nº Processo</label>
        <input type="text" id="numProc" name="numProc" placeholder="Ex: 012345/2026-67" maxlength="14" minlength="9"
          required class="border border-slate-500 rounded-sm" oninput="mascaraNumProc(this)" />
      </div>

      <div class="flex flex-col">
        <label for="edital">Edital</label>
        <input type="text" id="edital" name="edital" th:field="*{edital}" placeholder="Ex: 012/2026" maxlength="8"
          minlength="6" required class="border border-slate-500 rounded-sm"
          th:classappend="${#fields.hasErrors('edital')} ? 'border-red-800' : ''" oninput="mascaraEdital(this)" />
      </div>

      <div class="flex flex-col">
        <label for="douEdital">DOU Edital</label>
        <input type="text" id="douEdital" name="douEdital" placeholder="DOU do edital" maxlength="3" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="dataDouEdital">Data DOU Edital</label>
        <input type="date" id="dataDouEdital" name="dataDouEdital" required class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="assinante">Assinante</label>
        <select type="text" id="assinante" name="assinante" required class="border border-slate-500 rounded-sm">
          <option>Selecione...</option>
          <option>Alberto Segundo Spínola da Hora</option>
          <option>Solange Álvares dos Santos</option>
        </select>
      </div>

      <!-- ================= DADOS PESSOAIS ================= -->
      <div class="col-span-full text-center">Dados Pessoais</div>

      <div class="flex flex-col">
        <label for="nome">Nome do professor</label>
        <input type="text" id="nome" name="nome" placeholder="Nome completo" maxlength="70"
          oninput="this.value = this.value.toUpperCase();" required class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="somente numeros" minlength="14" maxlength="14" required
          class="border border-slate-500 rounded-sm" autocomplete="off" oninput="mascaraCpf(this)">
      </div>

      <div class="flex flex-col">
        <label for="estCivil">Estado civil</label>
        <select id="estCivil" name="estCivil" required class="border border-slate-500 rounded-sm">
          <option value="" disabled selected>Selecione...</option>
          <option value="solteiro(a)">Solteiro(a)</option>
          <option value="união Estável">União Estável</option>
          <option value="casado(a)">Casado(a)</option>
          <option value="divorciado(a)">Divorciado(a)</option>
          <option value="viúvo(a)">Viúvo(a)</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label for="nacionalidade">Nacionalidade</label>
        <input type="text" id="nacionalidade" name="nacionalidade" placeholder="brasileira" maxlength="40" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="rg">RG</label>
        <input type="text" id="rg" name="rg" placeholder="Ex: 123456789-0" maxlength="20" required
          class="border border-slate-500 rounded-sm" autocomplete="off">
      </div>

      <div class="flex flex-col">
        <label for="emissorRg">Emissor RG</label>
        <input type="text" id="emissorRg" name="emissorRg" placeholder="SSP/UF, ITEP/UF..."
          oninput="this.value = this.value.toUpperCase();" maxlength="10" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="passaporte">Passaporte</label>
        <input type="text" id="passaporte" name="passaporte" placeholder="Número do passaporte" maxlength="20"
          class="border border-slate-500 rounded-sm" autocomplete="off">
      </div>

      <div class="flex flex-col">
        <label for="emissorPassaporte">Emissor Passaporte</label>
        <input type="text" id="emissorPassaporte" name="emissorPassaporte" placeholder="Órgão emissor" maxlength="10"
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="logradouro">Logradouro</label>
        <select type="text" id="logradouro" name="logradouro" required class="border border-slate-500 rounded-sm">
          <option value="" disabled selected>Selecione...</option>
          <option value="rua">Rua</option>
          <option value="avenida">Avenida</option>
          <option value="travessa">Travessa</option>
          <option value="alameda">Alameda</option>
          <option value="praça">Praça</option>
          <option value="sítio">Sítio</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" placeholder="Nome da via" maxlength="40" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="enderecoNumero">Número</label>
        <input type="text" id="enderecoNumero" name="enderecoNumero" placeholder="Número do imóvel" maxlength="6"
          required class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="enderecoCompl">Complemento</label>
        <input type="text" id="enderecoCompl" name="enderecoCompl" placeholder="Apartamento, bloco, etc" maxlength="40"
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="enderecoBairro">Bairro</label>
        <input type="text" id="enderecoBairro" name="enderecoBairro" placeholder="Bairro" maxlength="40" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="enderecoCidade">Cidade</label>
        <input type="text" id="enderecoCidade" name="enderecoCidade" placeholder="Cidade" maxlength="40" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="enderecoEstado">Estado</label>
        <select type="text" id="enderecoEstado" name="enderecoEstado" placeholder="UF" required
          class="border border-slate-500 rounded-sm">
          <option value="" disabled selected>Selecione...</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
      </div>

      <!-- ================= DADOS FUNCIONAIS ================= -->
      <div class="col-span-full text-center">Dados Funcionais</div>

      <div class="flex flex-col">
        <label for="cargo">Cargo</label>
        <select id="cargo" name="cargo" placeholder="Professor Substituto" required
          class="border border-slate-500 rounded-sm" onchange="mudarClasse(); mudarSalario()">
          <option value="" disabled selected>Selecione...</option>
          <option value="Professor do Magistério Superior - Substituto">Professor Substituto</option>
          <option value="Professor do Ensino Básico, Técnico e Tecnológico - Substituto">Professor EBTT Substituto
          </option>
          <option value="Professor Temporário">Professor Temporário</option>
          <option value="Professor Visitante Adjunto">Professor Visitante Adjunto (Júnior)</option>
          <option value="Professor Visitante Associado">Professor Visitante Associado (Júnior)</option>
          <option value="Professor Visitante Titular">Professor Visitante Titular (Sênior)</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label for="unidade">Unidade</label>
        <select class="border border-slate-500 rounded-sm w-full" id="unidade" th:field="*{unidade}" name="unidade"
          maxlength="30" required>
          <option value="" disabled>Selecione...</option>
          <option th:each="u : ${unidades}" th:value="${u.getDescricao()}" th:text="${u.descricao}"></option>
        </select>
      </div>

      <div th:replace="~{fragments/area}"></div>

      <div class="flex flex-col">
        <label for="cargaHoraria">Carga horária</label>
        <select id="cargaHoraria" name="cargaHoraria" placeholder="Horas semanais" required
          class="border border-slate-500 rounded-sm" onchange="mudarSalario()">
          <option value="" disabled selected>Selecione...</option>
          <option value="20">20 horas</option>
          <option value="40">40 horas</option>
          <option value="99">Dedicação Exclusiva</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label for="titulacao">Titulação</label>
        <select id="titulacao" name="titulacao" required class="border border-slate-500 rounded-sm"
          onchange="mudarSalario()">
          <option value="Graduado" selected>Graduação</option>
          <option value="Aperfeiçoado">Aperfeiçoamento</option>
          <option value="Especialista">Especialização</option>
          <option value="Mestre">Mestrado</option>
          <option value="Doutor">Doutorado</option>
        </select>
      </div>

      <div id="repoRemun" style="display: none;">
        <span th:each="s,i: ${salarios}" th:id="'rem' + ${i.index}" th:data-value="${s.value}">
        </span>
      </div>

      <div class="flex flex-col">
        <span for="remuneracao">Remuneração:</span>
        <input type="hidden" id="remInput" name="remuneracao" />
        <strong for="renum" id="remun"
          th:text="${salarios != null and !salarios.empty ? #numbers.formatDecimal(salarios[0].value, 1, 'POINT', 2, 'COMMA') : ''}">0,00</strong>
        <input type="hidden" id="renum" />
      </div>

      <div class="flex flex-col">
        <label for="classe">Classe:</label>
        <input type="text" id="classe" name="classe" placeholder="Classe funcional" maxlength="10" required
          style="color: midnightblue; border-style: hidden;" readonly>
      </div>

      <div class="flex flex-col">
        <label for="dataAssinatura">Data assinatura</label>
        <input type="date" id="dataAssinatura" name="dataAssinatura" required
          class="border border-slate-500 rounded-sm">
      </div>

      <div class="flex flex-col">
        <label for="dataVigencia">Data vigência</label>
        <input type="date" id="dataVigencia" name="dataVigencia" required class="border border-slate-500 rounded-sm">
      </div>

      <div th:replace="~{fragments/btn-save}"></div>

    </form>

    <script th:src="@{/js/calc-vigencia.js}"></script>
    <script th:src="@{/js/remuneracao.js}"></script>
    <script th:src="@{/js/mascaras.js}"></script>
  </div>
</body>

</html>
