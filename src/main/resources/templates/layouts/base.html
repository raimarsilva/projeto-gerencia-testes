<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(home, cadastro)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title th:replace="${title}">Título padrão</title>
</head>

<body class="bg-slate-100 flex flex-col min-h-screen">
    <header class="bg-slate-900 text-white p-3">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="font-bold text-lg">Gestor de Contratos</span>
            <div sec:authorize="isAuthenticated()" class="align-middle">
                Logado como: <span th:text="${#strings.substringBefore(#authentication.name, '@')}">Nome do
                    usuário</span>
                <form th:action="@{/logout}" method="post" class="inline-block">
                    <button type="submit" title="Sair do sistema" aria-label="Sair do sistema"
                        class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition duration-150 ease-in-out cursor-pointer flex items-center justify-center">
                        <!-- Ícone SVG nativo de Logout (Sair) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </form>
            </div>
        </nav>
    </header>

    <main class="flex-grow p-3" sec:authorize="isAuthenticated()">
        <div th:replace="${home}"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        &copy;2026 - Raimar Silva
    </footer>
</body>

</html>
