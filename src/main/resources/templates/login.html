<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" class="h-full bg-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contratos</title>

    <!-- CSS estático gerado pelo executável do Tailwind v4.3.3 na raiz do projeto -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/output.css}">
</head>

<body class="flex min-h-full items-center justify-center p-4">

    <!-- Card Principal de Login -->
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md border border-slate-200">

        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-slate-800">Login</h2>
            <p class="text-md text-slate-500 mt-1">Acesse sua conta para continuar</p>
        </div>

        <!-- Formulário de Autenticação -->
        <form th:action="@{/login}" method="post" class="space-y-5">

            <!-- Campo de Usuário -->
            <div>
                <label for="username" class="block text-md font-medium text-slate-700 mb-1.5">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" autofocus required
                    class="w-full px-3.5 py-2.5 text-md text-slate-800 bg-white border border-slate-300 rounded-lg shadow-xs focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition" />
            </div>

            <!-- Campo de Senha -->
            <div>
                <label for="password" class="block text-md font-medium text-slate-700 mb-1.5">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required
                    class="w-full px-3.5 py-2.5 text-md text-slate-800 bg-white border border-slate-300 rounded-lg shadow-xs focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition" />
            </div>

            <!-- Botão de Submissão -->
            <button type="submit"
                class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-md rounded-lg shadow-xs hover:shadow transition duration-150 cursor-pointer">
                Entrar
            </button>
        </form>

        <!-- Mensagem de Erro do Spring Security -->
        <output th:if="${param.error}" role="alert"
            class="mt-6 p-3.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-md flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-600 shrink-0" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>Usuário ou senha inválidos.</span>
        </output>

        <!-- Mensagem de Logout -->
        <output th:if="${param.logout}"
            class="mt-6 p-3.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-md flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600 shrink-0" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span>Você saiu do sistema com sucesso.</span>
        </output>

    </div>

</body>

</html>
