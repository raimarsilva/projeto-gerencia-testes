<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Erro</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/output.css}">
</head>

<body class="flex flex-col bg-slate-200 text-center min-h-screen items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-red-500 mb-4">Erro imprevisto</h1>

        <p class="mb-2">Status: <span class="bg-slate-100 px-2 py-1 rounded" th:text="${status}"></span></p>
        <p class="mb-2">Mensagem: <span class="bg-slate-100 px-2 py-1 rounded" th:text="${error}"></span></p>
        <p class="text-slate-700 mb-6" th:text="${message}"></p>

        <a href="/home" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Voltar</a>
    </div>

</body>

</html>
