# Perfil ativo
spring.profiles.active=dev

# JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#server.error.include-stacktrace=never
#logging.level.org.hibernate=ERROR
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Desativa o cache do Thymeleaf em desenvolvimento
spring.thymeleaf.cache=false

# Garanta que o DevTools esteja ativo para restart/livereload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.url=${SUPABASE_URL}

gdrive.file-url=${GDRIVE_FILE_URL}

spring.config.import=optional:file:.env[.properties]
app.security.allowed-ips=${ALLOWED_IPS:127.0.0.1}
