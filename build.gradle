plugins {
	id 'org.springframework.boot' version '2.7.2'
	id 'io.spring.dependency-management' version '1.0.12.RELEASE'
	id 'java'
	// Other Plugins
	id("jacoco")
	// Verificação de vulnerabilidades web
	id 'org.owasp.dependencycheck' version '10.0.4'
}

jacoco {
	toolVersion = "0.8.7"
}

group = 'com.projeto.teste'
version = '0.1.93'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencyCheck{ // Para falher builds se achar vulnerab com nota CVSS >= 7.
	failOnError = false //nao bloqueia builds vulneraveis. true para bloquear.
	format = 'HTML'
	outputDirectory = "${buildDir}/reports/dependency-check"
	suppressionFile = 'config/dependencycheck/suppresions.xml' // opcional: para ignorar falsos positivos.
}

repositories {
	mavenCentral()
}

dependencyManagement{
	imports{
		mavenBom 'org.joinfaces:joinfaces-dependencies:4.7.18'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.joinfaces:jsf-spring-boot-starter'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-ui:1.6.9'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Thymeleaf with security
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'

	// external library for converting numbers to words
	implementation 'pl.allegro.finance:tradukisto:4.3.2'

	// Auth0
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'ognl:ognl:3.1.26'
}

// ========== BAIXAR E INSTALAR O TAILWIND NO SERVER ==========
import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

// 1. Task para baixar o executável oficial do Tailwind CLI 4.3.3 de forma segura
task downloadTailwindCli {
    def os = DefaultNativePlatform.currentOperatingSystem
    def arch = DefaultNativePlatform.currentArchitecture.name
    
    def platform = ""
    if (os.isLinux()) {
        platform = arch.contains("aarch64") ? "linux-arm64" : "linux-x64"
    } else if (os.isMacOsX()) {
        platform = arch.contains("aarch64") ? "macos-arm64" : "macos-x64"
    } else if (os.isWindows()) {
        platform = "windows-x64.exe"
    }

    def version = "v4.3.3" // Versão do Tailwind v4
    def downloadUrl = "https://github.com/tailwindlabs/tailwindcss/releases/download/${version}/tailwindcss-${platform}"
    def destination = file("${project.projectDir}/bin/tailwindcss")

    outputs.file(destination)

    doLast {
        if (!destination.exists()) {
            destination.parentFile.mkdirs()
            new URL(downloadUrl).withInputStream { i -> destination.withOutputStream { it << i } }
            if (!os.isWindows()) {
                exec { commandLine 'chmod', '+x', destination.absolutePath }
            }
        }
    }
}

// 2. Task para compilar o CSS antes do Spring Boot empacotar o .jar
task buildTailwind(type: Exec) {
    dependsOn downloadTailwindCli
    
    def cliPath = file("${project.projectDir}/bin/tailwindcss").absolutePath
    def inputCss = file("src/main/resources/static/css/input.css").absolutePath
    def outputCss = file("src/main/resources/static/css/output.css").absolutePath

    commandLine cliPath, '-i', inputCss, '-o', outputCss, '--minify'
}

// Garante que o Tailwind compila e gera o output.css dentro do JAR no Render
processResources.dependsOn buildTailwind

tasks.named('test') {
	useJUnitPlatform()
	testLogging{
		showStandardStreams=true
	}
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

